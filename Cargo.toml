[workspace]
resolver = "3"
members = ["crates/fl-core", "crates/fl-cli", "crates/fl-gui"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
blake3 = "=1.8.7"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = { version = "=0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
gilrs = "=0.11.2"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
toml = "=1.1.8"
fl-core = { path = "crates/fl-core" }
sevenz-rust2 = { version = "=0.24.2", default-features = false, features = ["bzip2", "deflate", "ppmd", "util"] }
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma"] }

[profile.release]
strip = true
